<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston</title>
<style>
  :root {
    --bg:#F3F5F8; --panel:#FFFFFF; --ink:#141B2D; --muted:#5F6B82; --line:#E1E5EC; --soft:#F7F8FB;
    --green:#1F8A5B; --amber:#B8860B; --red:#C0392B; --link:#2B5FAE;
    --green-bg:#E7F5EE; --amber-bg:#FBF3DC; --red-bg:#FBE9E7;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:15px/1.5 "Inter","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a { color:var(--link); }
  header { display:flex; align-items:center; gap:18px; padding:14px 28px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:-0.01em; cursor:pointer; }
  header .sub { color:var(--muted); font-size:13px; }
  header .spacer { flex:1; }
  header nav a { margin-left:14px; font-size:14px; text-decoration:none; color:var(--muted); }
  header nav a.on { color:var(--ink); font-weight:600; }
  header button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; }
  main { max-width:1120px; margin:0 auto; padding:28px; }
  h2 { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:32px 0 12px; }
  h2:first-child { margin-top:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .team-card { cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .team-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(20,27,45,.08); }
  .team-card .top { display:flex; align-items:baseline; gap:12px; }
  .team-card .name { font-size:20px; font-weight:700; flex:1; }
  .team-card .delta { font-size:13px; font-weight:600; }
  .delta.up { color:var(--green); } .delta.down { color:var(--red); } .delta.flat { color:var(--muted); }
  .scores { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill b { font-size:14px; }
  .pill.green { background:var(--green-bg); color:var(--green); } .pill.amber { background:var(--amber-bg); color:var(--amber); } .pill.red { background:var(--red-bg); color:var(--red); }
  .headline { font-size:14px; color:var(--ink); margin:8px 0 0; line-height:1.45; }
  .spark { display:block; width:100%; height:44px; margin-top:10px; }
  .hero { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .bigscores { display:flex; gap:18px; flex-wrap:wrap; }
  .bigscore { display:flex; align-items:center; gap:12px; min-width:170px; }
  .bigscore .n { font-size:44px; font-weight:800; line-height:1; letter-spacing:-0.03em; }
  .n.green { color:var(--green); } .n.amber { color:var(--amber); } .n.red { color:var(--red); }
  .bigscore .l { font-size:13px; color:var(--muted); line-height:1.3; }
  .bigscore .l b { display:block; color:var(--ink); font-size:14px; }
  .insight { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .insight:last-child { border-bottom:0; }
  .insight .dot { flex:0 0 10px; width:10px; height:10px; border-radius:50%; margin-top:6px; }
  .dot.better { background:var(--green); } .dot.worse { background:var(--red); } .dot.chronic { background:var(--red); box-shadow:0 0 0 3px var(--red-bg); } .dot.good, .dot.new { background:var(--muted); }
  .heat { width:100%; border-collapse:separate; border-spacing:3px; font-size:12px; }
  .heat th { text-align:left; font-weight:500; color:var(--muted); padding:2px 6px; white-space:nowrap; }
  .heat th.s { text-align:center; }
  .heat td { text-align:center; padding:6px 2px; border-radius:5px; font-weight:600; font-size:11px; min-width:44px; }
  .heat td.green { background:var(--green-bg); color:var(--green); } .heat td.amber { background:var(--amber-bg); color:var(--amber); } .heat td.red { background:var(--red-bg); color:var(--red); } .heat td.none { background:var(--soft); color:var(--muted); }
  .tabs { display:flex; gap:4px; margin:28px 0 14px; border-bottom:1px solid var(--line); overflow-x:auto; }
  .tabs a { padding:10px 14px; text-decoration:none; color:var(--muted); font-size:14px; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a.on { color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
  .finding { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px; }
  .finding.red { border-left-color:var(--red); } .finding.amber { border-left-color:var(--amber); } .finding.green { border-left-color:var(--green); }
  .finding .row { display:flex; gap:12px; align-items:baseline; }
  .finding .title { font-weight:600; flex:1; }
  .finding .val { font-weight:700; font-variant-numeric:tabular-nums; }
  .finding .msg { margin:4px 0 0; }
  .finding .act { margin:6px 0 0; color:var(--muted); }
  .finding .act::before { content:"Do this: "; color:var(--ink); font-weight:600; }
  details { margin-top:6px; font-size:13px; } summary { color:var(--link); cursor:pointer; }
  details code { background:var(--soft); padding:1px 6px; border-radius:4px; margin:4px 4px 0 0; display:inline-block; }
  .rec { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:12px; }
  .rec .row { display:flex; gap:12px; align-items:baseline; }
  .rec .title { font-weight:700; font-size:16px; flex:1; }
  .rec .meta { color:var(--muted); font-size:13px; }
  .rec ol { margin:8px 0 0; padding-left:20px; } .rec li { margin-bottom:4px; }
  .rec .status { margin-top:10px; font-size:13px; color:var(--muted); }
  .gate { border-left:5px solid var(--red); } .gate.open { border-left-color:var(--green); }
  table.t { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:14px; }
  table.t th, table.t td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  table.t th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; background:var(--soft); }
  table.t tr:last-child td { border-bottom:0; }
  .num { text-align:right !important; font-variant-numeric:tabular-nums; }
  .warn { color:var(--red); font-weight:600; }
  .note { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  @media (max-width:760px) { main { padding:16px; } .hero { grid-template-columns:1fr; } .bigscore .n { font-size:36px; } header { padding:12px 16px; } header .sub { display:none; } }
</style>
</head>
<body>
<header>
  <h1 onclick="go('')">Houston</h1>
  <span class="sub">Engineering health. Refreshed nightly.</span>
  <span class="spacer"></span>
  <nav id="crumbs"></nav>
  <button id="refresh">Refresh now</button>
</header>
<main id="main"><p class="empty">Loading.</p></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const api = (p) => fetch('/api' + p).then((r) => r.json());
const rag = (v, thr = [75, 50]) => v >= thr[0] ? 'green' : v >= thr[1] ? 'amber' : 'red';

function spark(points, w = 300, h = 44) {
  if (!points.length) return '';
  const xs = points.map((_, i) => 8 + i * ((w - 16) / Math.max(1, points.length - 1)));
  const y = (v) => h - 6 - (v / 100) * (h - 12);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${xs[i]},${y(p.score)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="8" x2="${w - 8}" y1="${y(75)}" y2="${y(75)}" stroke="#E1E5EC" stroke-dasharray="3 3"/>
    <path d="${path}" fill="none" stroke="#141B2D" stroke-width="2" stroke-linejoin="round"/>
    ${points.map((p, i) => `<circle cx="${xs[i]}" cy="${y(p.score)}" r="3.5" fill="var(--${p.rag})"><title>${esc(p.sprint)}: ${p.score}</title></circle>`).join('')}
  </svg>`;
}

function go(board, tab) { location.hash = board ? `#${encodeURIComponent(board)}${tab ? '/' + tab : ''}` : ''; }
window.addEventListener('hashchange', route); route();

async function route() {
  const [board, tab] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (!board) return overview();
  return team(board, tab || 'overview');
}

async function overview() {
  $('#crumbs').innerHTML = '';
  const teams = await api('/teams');
  teams.sort((a, b) => a.score - b.score);
  if (!teams.length) return $('#main').innerHTML = '<p class="empty">No data yet. Fill .env and press Refresh now.</p>';
  const worst = teams[0];
  $('#main').innerHTML = `
    <h2>Teams, worst first</h2>
    <div class="grid">${teams.map((t) => `
      <div class="card team-card" onclick="go('${esc(t.board)}')">
        <div class="top"><span class="name">${esc(t.board)}</span>
          <span class="delta ${t.delta > 0 ? 'up' : t.delta < 0 ? 'down' : 'flat'}">${t.delta > 0 ? '▲' : t.delta < 0 ? '▼' : '•'} ${Math.abs(t.delta)} vs last sprint</span></div>
        <div class="scores">
          <span class="pill ${t.rag}"><b>${t.score}</b> sprint</span>
          ${t.flowScore != null ? `<span class="pill ${t.flowRag}"><b>${t.flowScore}</b> flow</span>` : ''}
          ${t.qualityScore != null ? `<span class="pill ${t.qualityRag}"><b>${t.qualityScore}</b> quality</span>` : ''}
          ${t.featuresScore != null ? `<span class="pill ${rag(t.featuresScore)}"><b>${t.featuresScore}</b> features</span>` : ''}
          ${t.opsScore != null ? `<span class="pill ${rag(t.opsScore)}"><b>${t.opsScore}</b> prod</span>` : ''}
          ${t.docsScore != null ? `<span class="pill ${rag(t.docsScore)}"><b>${t.docsScore}</b> docs</span>` : ''}
        </div>
        <p class="headline">${esc(t.headline)}</p>
        ${spark(t.trend)}
      </div>`).join('')}
    </div>
    <p class="note">Sprint score over the last ${worst.trend.length} sprints, dotted line is 75 (green). Tap a team.</p>`;
}

const finding = (board, f) => `
  <div class="finding ${f.rag}">
    <div class="row"><span class="title">${esc(f.title)}</span><span class="val">${f.unit === '%' ? Math.round(f.value) + '%' : f.value}${f.unit === 'days' ? 'd' : ''}</span></div>
    <p class="msg">${esc(f.message)}</p>
    ${f.rag !== 'green' ? `<p class="act">${esc(f.action)}</p>` : ''}
    ${f.evidence.length ? `<details><summary>${f.evidence.length} records</summary>${f.evidence.map((k) => `<code>${esc(k)}</code>`).join('')} <a href="/api/teams/${encodeURIComponent(board)}/evidence/${f.ruleId}" target="_blank">raw evidence</a></details>` : ''}
  </div>`;

async function team(board, tab) {
  const [d, p, r] = await Promise.all([api('/teams/' + encodeURIComponent(board)), api('/teams/' + encodeURIComponent(board) + '/people').catch(() => ({ people: [], github: [], docs: [] })), api('/teams/' + encodeURIComponent(board) + '/recommendations')]);
  const { latest, history, quality, flow, docs, features, ops, actions, insights, heatmap, window: win, output, incidents } = d;
  const trend = [...history].sort((a, b) => a.sprintId - b.sprintId).map((c) => ({ sprint: c.sprintName, score: c.score, rag: c.rag }));
  const tabs = [['overview', 'Overview'], ['sprint', 'Sprint'], flow && ['flow', 'Flow & DORA'], quality && ['quality', 'Quality'], features && ['features', 'Features'], ops && ['prod', 'Production & cost'], docs && ['docs', 'Docs'], p.people?.length && ['people', 'People']].filter(Boolean);
  $('#crumbs').innerHTML = `<a href="#" onclick="go('');return false">All teams</a><a class="on">${esc(board)}</a>`;
  const big = (n, label, sub) => n == null ? '' : `<div class="bigscore"><span class="n ${rag(n)}">${n}</span><span class="l"><b>${label}</b>${sub}</span></div>`;
  const rec = (x, i) => { const a = (actions || []).filter((y) => y.recId === x.id).sort((y, z) => z.at.localeCompare(y.at))[0]; return `
    <div class="rec"><div class="row"><span class="title">${i + 1}. ${esc(x.title)}</span><span class="meta">${esc(x.owner)} · ${esc(x.horizon.toLowerCase())}</span></div>
      <p class="msg">${esc(x.why)}</p><ol>${x.what.map((w) => `<li>${esc(w)}</li>`).join('')}</ol>
      <div class="status">${a ? `${esc(a.status)} by ${esc(a.owner)} on ${a.at.slice(0, 10)}${a.note ? ': ' + esc(a.note) : ''}` :
        `<a href="#" onclick="act('${esc(board)}','${x.id}','accepted');return false">Accept</a> · <a href="#" onclick="act('${esc(board)}','${x.id}','done');return false">Mark done</a> · <a href="#" onclick="act('${esc(board)}','${x.id}','rejected');return false">Reject</a>`}</div>
    </div>`; };
  const gate = r.headcountGate;
  const content = {
    overview: () => `
      <div class="hero">
        <div class="card">
          <div class="bigscores">
            ${big(latest.score, 'Sprint process', latest.sprintName)}${big(flow?.score, 'Flow & DORA', 'GitHub, 90 days')}${big(quality?.score, 'Quality', 'Sonar, Testmo, Jira')}
            ${big(features?.score, 'Features', 'Jira epics')}${big(ops?.score, 'Production & cost', 'Azure')}${big(docs?.score, 'Docs', 'Confluence')}
          </div>
          ${spark(trend, 600, 60)}
          <p class="note">Sprint score, ${trend[0]?.sprint} to ${trend[trend.length - 1]?.sprint}.</p>
        </div>
        <div class="card"><h2>Since last sprint</h2>${(insights || []).length ? insights.map((i) => `<div class="insight"><span class="dot ${i.kind}"></span><span>${esc(i.text)}</span></div>`).join('') : '<p class="note">Need two sprints for a comparison.</p>'}</div>
      </div>
      ${win ? `<h2>90 day window</h2>
      <div class="rec gate ${win.onTrack ? 'open' : ''}"><p class="msg">${esc(win.verdict)}</p>
        <table class="t" style="margin-top:10px"><tr><th>Target</th><th>Goal</th><th class="num">At start</th><th class="num">Now</th><th>Met</th></tr>
        ${win.targets.map((t) => `<tr><td>${esc(t.name)}</td><td>${esc(t.target)}</td><td class="num">${t.start ?? '·'}</td><td class="num">${t.now ?? '·'}</td><td class="${t.met ? '' : 'warn'}">${t.met ? 'Yes' : 'No'}</td></tr>`).join('')}</table>
        <p class="note">${win.start} to ${win.end}. Set WINDOW_START in .env. Same targets the team sees in the digest.</p></div>` : ''}
      ${output ? `<h2>Output and cost</h2><div class="card"><p class="msg">${esc(output.verdict)}</p>
        <div class="scores" style="margin-top:10px">
          <span class="pill ${output.pointsPerEngineerPerSprint >= 8 ? 'green' : output.pointsPerEngineerPerSprint >= 5 ? 'amber' : 'red'}"><b>${output.pointsPerEngineerPerSprint}</b> points / engineer / sprint</span>
          <span class="pill ${output.mergedPrsPerEngineerPerWeek >= 2 ? 'green' : output.mergedPrsPerEngineerPerWeek >= 1 ? 'amber' : 'red'}"><b>${output.mergedPrsPerEngineerPerWeek}</b> merged PRs / engineer / week</span>
          ${output.costRatio ? `<span class="pill ${output.costRatio <= 1.5 ? 'green' : output.costRatio <= 2.5 ? 'amber' : 'red'}"><b>${output.costRatio}x</b> offshore cost</span>` : ''}
          ${output.outputRatioVsBest != null ? `<span class="pill ${output.outputRatioVsBest >= 0.8 ? 'green' : output.outputRatioVsBest >= 0.5 ? 'amber' : 'red'}"><b>${Math.round(output.outputRatioVsBest * 100)}%</b> of best team per head</span>` : ''}
        </div></div>` : ''}
      ${incidents ? `<h2>Incident log</h2><div class="finding ${incidents.missing ? 'red' : 'green'}"><p class="msg">${esc(incidents.verdict)}</p>${incidents.missing ? '<p class="act">Every Sev0 to Sev2 incident gets a post-incident page within 3 days: what happened, impact, root cause, one action. Label it "incident".</p>' : ''}</div>` : ''}
      <h2>Recommendations</h2>${r.recommendations.map(rec).join('') || '<p class="note">No gaps found.</p>'}
      <h2>Headcount gate</h2>
      <div class="rec gate ${gate.ready ? 'open' : ''}"><p class="msg"><b>${gate.ready ? 'Open' : 'Closed'}.</b> ${esc(gate.verdict)}</p>
        <table class="t" style="margin-top:10px"><tr><th>Condition</th><th>Target</th><th>Actual</th><th>Met</th></tr>
        ${gate.criteria.map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.target)}</td><td>${esc(x.actual)}</td><td class="${x.met ? '' : 'warn'}">${x.met ? 'Yes' : 'No'}</td></tr>`).join('')}</table></div>
      <h2>Every check, every sprint</h2>
      <div class="card" style="overflow-x:auto"><table class="heat"><tr><th></th>${heatmap.sprints.map((s) => `<th class="s">${esc(s)}</th>`).join('')}</tr>
        ${heatmap.rows.map((row) => `<tr><th>${esc(row.title)}</th>${row.cells.map((c) => c ? `<td class="${c.rag}" title="${esc(row.title)}: ${esc(c.value)}">${esc(c.value)}</td>` : '<td class="none">·</td>').join('')}</tr>`).join('')}</table>
        <p class="note">A row that is red across the board is structural. A row that just turned red is new.</p></div>`,
    sprint: () => `<h2>${esc(latest.sprintName)}</h2>${latest.findings.map((f) => finding(board, f)).join('')}`,
    flow: () => `<h2>Flow & DORA, GitHub, ${flow.since.slice(0, 10)} to ${flow.until.slice(0, 10)}</h2>${flow.findings.map((f) => finding(board, f)).join('')}`,
    quality: () => `<h2>Quality</h2>${quality.findings.map((f) => finding(board, f)).join('')}`,
    features: () => `<h2>Features, from Jira epics</h2>${features.findings.map((f) => finding(board, f)).join('')}`,
    prod: () => `<h2>Production & cost, Azure</h2>${ops.findings.map((f) => finding(board, f)).join('')}`,
    docs: () => `<h2>Documentation, Confluence</h2>${docs.findings.map((f) => finding(board, f)).join('')}`,
    people: () => `
      <h2>Jira, last ${p.people[0]?.sprints ?? 0} sprints</h2>
      <table class="t"><tr><th>Name</th><th class="num">Done</th><th class="num">Points</th><th class="num">Median days</th><th class="num">Over norm</th><th class="num">Stuck now</th><th class="num">Carried</th></tr>
      ${p.people.map((x) => `<tr><td>${esc(x.name)}</td><td class="num">${x.ticketsDone}</td><td class="num">${x.pointsDone}</td><td class="num ${x.medianCycleDays > x.teamMedianCycleDays * 1.5 ? 'warn' : ''}">${x.medianCycleDays}</td><td class="num ${x.overBand >= 3 ? 'warn' : ''}">${x.overBand}</td><td class="num ${x.stuckNow ? 'warn' : ''}">${x.stuckNow}</td><td class="num">${x.carriedOver}</td></tr>`).join('')}</table>
      <p class="note">Team median ${p.people[0]?.teamMedianCycleDays} days. Norm by size: ${Object.entries(p.baseline || {}).map(([k, v]) => `${k} pt ${v}d`).join(', ')}.</p>
      ${p.github?.length ? `<h2>GitHub, last 90 days</h2>
      <table class="t"><tr><th>Name</th><th class="num">PRs</th><th class="num">Merged</th><th class="num">Lines</th><th class="num">Median PR</th><th class="num">Reviews</th><th class="num">Review %</th><th>Lanes</th><th>Flags</th></tr>
      ${p.github.map((x) => `<tr><td>${esc(x.name)}</td><td class="num ${x.prsAuthored === 0 ? 'warn' : ''}">${x.prsAuthored}</td><td class="num">${x.prsMerged}</td><td class="num">${x.linesChanged.toLocaleString()}</td><td class="num ${x.medianPrSize > 800 ? 'warn' : ''}">${x.medianPrSize}</td><td class="num">${x.reviewsGiven}</td><td class="num ${x.reviewShare >= 40 ? 'warn' : ''}">${x.reviewShare}%</td><td>${esc(x.lanes.filter((l) => l !== 'other').join(', ') || 'none')}</td><td class="${x.flags.length ? 'warn' : ''}">${esc(x.flags.join(' '))}</td></tr>`).join('')}</table>` : ''}
      ${p.docs?.length ? `<h2>Confluence, last 90 days</h2>
      <table class="t"><tr><th>Name</th><th class="num">Created</th><th class="num">Edited</th><th class="num">ADRs</th><th class="num">Runbooks</th><th>Last</th></tr>
      ${p.docs.map((x) => `<tr><td>${esc(x.name)}</td><td class="num">${x.created}</td><td class="num">${x.edited}</td><td class="num">${x.adrs}</td><td class="num">${x.runbooks}</td><td>${x.last ? x.last.slice(0, 10) : ''}</td></tr>`).join('')}</table>` : ''}
      ${p.activity?.length ? `<h2>Active days, last 6 weeks</h2>
      <table class="t"><tr><th>Name</th><th class="num">Active days / week</th><th class="num">Weekdays with a trace</th><th>Pattern</th><th>Last active</th></tr>
      ${p.activity.map((x) => `<tr><td>${esc(x.name)}</td><td class="num ${x.activeDaysPerWeek < 3 ? 'warn' : ''}">${x.activeDaysPerWeek}</td><td class="num">${x.weekdaysCovered} of ${x.weekdaysInWindow}</td><td>${esc(x.pattern)}</td><td>${x.lastActive ?? ''}</td></tr>`).join('')}</table>
      <p class="note">A day counts if any Jira transition or GitHub action left a trace. This is not attendance and not hours. Someone can be in the office all day with no trace, or at home with ten. Use it to ask, never to conclude.</p>` : ''}
      <p class="note">Questions to ask, not verdicts. Absence in a tool is proof of no trace, not of no work.</p>`,
  };
  $('#main').innerHTML = `
    <div class="tabs">${tabs.map(([k, l]) => `<a href="#" class="${k === tab ? 'on' : ''}" onclick="go('${esc(board)}','${k}');return false">${l}</a>`).join('')}</div>
    ${(content[tab] || content.overview)()}`;
  window.scrollTo(0, 0);
}

async function act(board, recId, status) {
  const owner = prompt('Your name for the action log:'); if (!owner) return;
  const note = prompt('Note (optional):') || '';
  await fetch('/api/teams/' + encodeURIComponent(board) + '/actions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recId, status, owner, note }) });
  route();
}
$('#refresh').onclick = async () => { $('#refresh').textContent = 'Refreshing'; await fetch('/api/refresh', { method: 'POST' }); $('#refresh').textContent = 'Refresh now'; route(); };
</script>
</body>
</html>
