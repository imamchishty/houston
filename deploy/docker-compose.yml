# Quickest way to run on any VM inside the network: docker compose -f deploy/docker-compose.yml up -d
services:
  houston:
    build: ..
    ports: ["4000:4000"]
    env_file: ../.env
    environment: { HOUSTON_DATA_DIR: /data }
    volumes: [houston-data:/data]
    restart: unless-stopped
  nightly:
    build: ..
    env_file: ../.env
    environment: { HOUSTON_DATA_DIR: /data }
    volumes: [houston-data:/data]
    # Collect and score once a day; on Fridays also post the digest to Teams (skipped if TEAMS_WEBHOOK is blank).
    entrypoint: ["sh", "-c", "while true; do node dist/cli.js; [ \"$$(date +%u)\" = 5 ] && node dist/cli.js notify; sleep 86400; done"]
    restart: unless-stopped
volumes:
  houston-data:
