name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env: { HOUSTON_MODE: demo, HOUSTON_DATA_DIR: /tmp/houston-data }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: BDD
        run: npm run bdd
      # Stamps build-info.json with this run's number, commit and time: the footer shows "build <run number>".
      - run: npm run build
      - run: bash -n deploy/azure.sh
      - name: Build stamp
        run: cat build-info.json
