name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env: { HOUSTON_MODE: demo, HOUSTON_DATA_DIR: /tmp/houston-data }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: BDD
        run: npm run bdd
      # The same report the admin page shows, kept with the run
      - name: Test report
        run: npm run report -- --existing
      - uses: actions/upload-artifact@v4
        with: { name: test-report, path: reports/test-report.json }
      # Stamps build-info.json with this run's number, commit and time: the footer shows "build <run number>".
      - run: npm run build
      - run: bash -n deploy/azure.sh
      - name: Redeploy keeps the data (fake az)
        run: pip install --quiet pyyaml && npm run test:deploy
      - name: Build stamp
        run: cat build-info.json
